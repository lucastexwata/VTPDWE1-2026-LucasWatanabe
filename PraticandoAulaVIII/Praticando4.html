<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 4 - Caixas verdes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        /* Classe reutilizável para limpar flutuações entre as linhas */
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        .linha {
            margin-bottom: 20px;
        }

        /* Estilo base para todas as caixas */
        .box {
            background-color: green;
        }

        /* --- LINHA 1: Caixas quadradas no topo direito --- */
        .box-square {
            width: 80px;
            height: 80px;
            float: right;
            margin-left: 15px; /* Espaçamento entre elas */
        }

        /* --- LINHA 2: Retângulos horizontais à esquerda --- */
        .box-horizontal {
            width: 300px;
            height: 80px;
            float: left;
            margin-right: 20px;
        }

        /* --- LINHA 3: Retângulos verticais --- */
        .box-vertical-left {
            width: 90px;
            height: 250px;
            float: left;
        }

        .box-vertical-right {
            width: 90px;
            height: 250px;
            float: right;
            margin-left: 15px;
        }
    </style>
</head>

<body>
    <nav class="nav-global">
        <a href="../index.html">🏠 Site Pessoal</a> |
        <a href="index.html">&lt;&lt; Voltar para Aula VI</a>
    </nav>

    <h1>Praticando 4 - Caixas verdes</h1>

    <!-- LINHA 1: 3 Caixas quadradas à direita -->
    <div class="linha clearfix">
        <div class="box box-square"></div>
        <div class="box box-square"></div>
        <div class="box box-square"></div>
    </div>

    <!-- LINHA 2: 2 Caixas horizontais à esquerda -->
    <div class="linha clearfix">
        <div class="box box-horizontal"></div>
        <div class="box box-horizontal"></div>
    </div>

    <!-- LINHA 3: 1 Caixa vertical à esquerda e 2 à direita -->
    <div class="linha clearfix">
        <div class="box box-vertical-left"></div>
        <div class="box box-vertical-right"></div>
        <div class="box box-vertical-right"></div>
    </div>

</body>

</html>
